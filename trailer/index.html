<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Blind Mice: Sea-All — Teaser</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root { --cy: #7ef2ff; --amber: #e7b567; }
  html, body { margin: 0; height: 100%; background: #000; color: #cfe; font-family: 'Share Tech Mono', monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas#c { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; background: #000; }
  #gate { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
          background: radial-gradient(ellipse at 50% 50%, rgba(2,6,10,.55) 0%, rgba(1,3,6,.92) 75%), url(assets/poster.jpg) center / cover no-repeat, #020409;
          z-index: 5; transition: opacity .6s; }
  #gate h1 { font-family: Cinzel, serif; font-weight: 700; letter-spacing: .32em; font-size: clamp(22px, 4.2vw, 64px); margin: 0; color: #e9dcc0;
             text-shadow: 0 0 18px rgba(231,181,103,.35); text-align: center; }
  #gate h2 { font-family: Silkscreen, monospace; font-weight: 400; letter-spacing: .5em; font-size: clamp(14px, 2vw, 28px); margin: 0; color: var(--cy);
             text-shadow: 0 0 12px rgba(126,242,255,.8); }
  #play { font-family: Silkscreen, monospace; font-size: 18px; letter-spacing: .3em; color: #041018; background: var(--cy); border: 0; padding: 16px 38px 14px 44px;
          cursor: pointer; box-shadow: 0 0 24px rgba(126,242,255,.6); }
  #play:disabled { opacity: .35; cursor: wait; }
  #load { font-size: 12px; letter-spacing: .2em; color: #6aa; height: 14px; }
  #hint { font-size: 11px; color: #577; letter-spacing: .15em; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px 12px; display: flex; gap: 12px; align-items: center; z-index: 4;
         background: linear-gradient(transparent, rgba(0,0,0,.75)); opacity: 0; transition: opacity .3s; }
  body:hover #bar, #bar.show { opacity: 1; }
  #bar button { font-family: Silkscreen, monospace; background: transparent; color: var(--cy); border: 1px solid rgba(126,242,255,.5); padding: 6px 12px; cursor: pointer; }
  #scrub { flex: 1; accent-color: #7ef2ff; }
  #time { font-size: 13px; min-width: 110px; text-align: right; color: #9cc; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="gate">
  <h1>THREE BLIND MICE</h1>
  <h2>SEA-ALL</h2>
  <button id="play" disabled>LOADING</button>
  <div id="load"></div>
  <div id="hint">TEASER · 29 s · HEADPHONES RECOMMENDED</div>
</div>
<div id="bar">
  <button id="pp">PAUSE</button>
  <input id="scrub" type="range" min="0" max="29" step="0.0333333" value="0">
  <div id="time">00.00 / 29.00</div>
</div>
<audio id="aud" src="audio/trailer_mix.wav" preload="auto"></audio>
<script src="assets/pack/manifest.js" onerror="void 0"></script>
<script src="assets/app.js"></script>
</body>
</html>
